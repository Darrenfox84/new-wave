<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Wave | Your Music. Your People.</title>
<style>
:root{color-scheme:dark;--bg:#0b0b17;--panel:#171529;--border:#34304d;--purple:#b56cff;--muted:#b6b3c9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:white;font:16px/1.5 system-ui,Arial,sans-serif}
header{border-bottom:1px solid var(--border);padding:16px max(16px,calc((100vw - 1100px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:9px;font-size:20px;letter-spacing:1px;font-weight:900;color:#25dfff}.logo img{width:54px;height:54px;object-fit:contain}.hero-logo{display:block;width:min(330px,80vw);height:auto;margin:0 auto 10px}.artist-link{background:transparent;color:#48e7f5;padding:2px 0;text-decoration:underline;text-underline-offset:3px}.artist-link:hover{color:white}.artist-back{margin-bottom:12px}
main{max-width:1100px;margin:auto;padding:20px 16px 70px}.hero{text-align:center;padding:42px 0 22px}
h1{font-size:clamp(40px,9vw,68px);line-height:1.1;color:var(--purple);margin:0}h2{margin:0 0 14px}
p{color:var(--muted)}.hero p{max-width:620px;margin:14px auto 24px}
button,input,textarea,select{font:inherit}button{border:0;border-radius:10px;background:var(--purple);color:#100a1d;font-weight:700;padding:11px 17px;cursor:pointer}
button.secondary{background:#302943;color:white}button:disabled{opacity:.55;cursor:wait}
input,textarea,select{width:100%;padding:12px;border:1px solid #4b4567;border-radius:10px;background:#0e0d1d;color:white;margin:6px 0 12px}
textarea{min-height:100px;resize:vertical}.hidden{display:none!important}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:22px;margin:18px 0}
.auth{max-width:520px;margin:20px auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.track,.post{border:1px solid var(--border);border-radius:12px;padding:15px;margin:12px 0;background:#100f20}
.track h3,.post h3{margin:0 0 4px}.small{font-size:13px;color:var(--muted)}.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inline button{padding:8px 12px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.tabs button.active{background:var(--purple);color:#100a1d}.tabs button{background:#302943;color:white}
audio{width:100%;margin-top:12px}#message{white-space:pre-wrap;padding:8px 0;color:#f0d4ff}
label{display:block;color:#d6d1e6;font-weight:600}.divider{border:0;border-top:1px solid var(--border);margin:20px 0}
footer{text-align:center;padding:20px;border-top:1px solid var(--border)}
@media(max-width:500px){.card{padding:16px}.hero{padding-top:22px}}
</style>
</head>
